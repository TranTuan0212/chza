workflows:
  build-roothide:
    name: Build ZaloTweak (Roothide)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: 26.5
      vars:
        THEOS: /Users/builder/theos
    scripts:
      - name: Setup Theos, ldid and iOS SDK
        script: |
          echo "==> Cai dat cong cu ky ldid..."
          brew install ldid
          echo "==> Dang cai dat Theos ho tro Roothide & Rootless..."
          rm -rf $THEOS
          git clone --depth=1 --recursive --shallow-submodules https://github.com/roothide/theos.git $THEOS
          echo "==> Dang cai dat iOS 16.5 SDK..."
          mkdir -p $THEOS/sdks
          if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz && [ -s /tmp/iPhoneOS16.5.sdk.tar.xz ]; then
            tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
            rm -f /tmp/iPhoneOS16.5.sdk.tar.xz
          else
            echo "==> curl that bai hoac 504 timeout, dang clone truc tiep tu repository theos/sdks..."
            rm -rf $THEOS/sdks
            git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          fi
      - name: Build Roothide DEB
        script: |
          echo "==> Bien dich ban Roothide..."
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          find .theos/ -name "Zalotweak.dylib" -exec cp {} packages/ \; 2>/dev/null || true
    artifacts:
      - packages/*.deb
      - packages/*.dylib

  build-rootless:
