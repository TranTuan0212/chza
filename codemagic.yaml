workflows:
  build-roothide:
    name: Build ZaloTweak (Roothide)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: 26.5
      vars:
        THEOS: /Users/builder/theos
    scripts:
      - name: Setup Theos, ldid and iOS SDK
        script: |
          echo "==> Cai dat cong cu ky ldid..."
          brew install ldid
          echo "==> Dang cai dat Theos ho tro Roothide & Rootless..."
          rm -rf $THEOS
          git clone --depth=1 --recursive --shallow-submodules https://github.com/roothide/theos.git $THEOS
          echo "==> Dang tai va giai nen iOS 16.5 SDK chua day du Private Frameworks..."
          mkdir -p $THEOS/sdks
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
      - name: Build Roothide DEB
        script: |
          echo "==> Bien dich ban Roothide..."
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
    artifacts:
      - packages/*.deb

  build-rootless:
    name: Build ZaloTweak (Rootless)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: 26.5
      vars:
        THEOS: /Users/builder/theos
    scripts:
      - name: Setup Theos, ldid and iOS SDK
        script: |
          echo "==> Cai dat cong cu ky ldid..."
          brew install ldid
          echo "==> Dang cai dat Theos ho tro Roothide & Rootless..."
          rm -rf $THEOS
          git clone --depth=1 --recursive --shallow-submodules https://github.com/roothide/theos.git $THEOS
          echo "==> Dang tai va giai nen iOS 16.5 SDK chua day du Private Frameworks..."
          mkdir -p $THEOS/sdks
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
      - name: Build Rootless DEB
        script: |
          echo "==> Bien dich ban Rootless..."
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
    artifacts:
      - packages/*.deb
